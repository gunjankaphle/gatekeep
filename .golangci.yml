version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - copyloopvar
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    staticcheck:
      # Preserve the v1 staticcheck + gosimple checks, without adding stylecheck.
      checks:
        - "SA*"
        - "S*"
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
    gosec:
      excludes:
        - G104 # Audit errors are non-fatal.
  exclusions:
    generated: lax
    paths:
      - ^web/
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^web/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
